<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Choice | Admin Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #f3f4f6; color: #1f2937; padding: 20px; }
    
    #loginBox { max-width: 400px; margin: 100px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
    #loginBox h2 { margin-bottom: 20px; color: #111827; }
    #loginBox input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 15px; }
    #loginBox button { width: 100%; background: #f59e0b; color: white; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    
    #adminDashboard { display: none; max-width: 1000px; margin: 20px auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #e5e7eb; padding-bottom: 10px; }
    .admin-form { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; background: #f9fafb; padding: 20px; border-radius: 8px; border: 1px solid #e5e7eb; }
    .form-group-full { grid-column: span 2; }
    .admin-form label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px; }
    .admin-form input, .admin-form select { width: 100%; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; }
    
    .admin-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
    .admin-table th, .admin-table td { border: 1px solid #e5e7eb; padding: 10px; text-align: left; }
    .admin-table th { background: #f3f4f6; }
    .btn-action { padding: 5px 10px; border-radius: 4px; border: none; font-size: 12px; cursor: pointer; font-weight: bold; color: white; margin-right: 4px; }
    .btn-del { background: #ef4444; }
    .btn-toggle { background: #3b82f6; }
    .btn-edit { background: #10b981; }
    .btn-exit { background: #6b7280; text-decoration: none; padding: 6px 12px; border-radius: 6px; color: white; font-size: 13px; }
  </style>
</head>
<body>

  <!-- Login Overlay -->
  <div id="loginBox">
    <h2>🔐 Admin Login</h2>
    <input type="password" id="adminPassInput" placeholder="Enter Admin Password">
    <button onclick="checkAdminLogin()">Login</button>
  </div>

  <!-- Admin Dashboard Panel -->
  <div id="adminDashboard">
    <div class="admin-header">
      <h2>Nexus Choice - Admin Dashboard</h2>
      <a href="index.html" class="btn-exit" target="_blank">🏠 View Store</a>
    </div>

    <!-- Add / Edit Product Form -->
    <form class="admin-form" id="addProductForm" onsubmit="saveProduct(event)">
      <input type="hidden" id="editProductId">
      <div>
        <label>Product Title</label>
        <input type="text" id="pTitle" required placeholder="e.g. T800 Ultra Smart Watch">
      </div>
      <div>
        <label>Status</label>
        <select id="pStatus">
          <option value="in">In Stock</option>
          <option value="out">Out of Stock</option>
        </select>
      </div>
      <div>
        <label>Original Price (Rs.)</label>
        <input type="number" id="pOriginalPrice" placeholder="e.g. 3000">
      </div>
      <div>
        <label>Discount Price (Rs.) [Final Price]</label>
        <input type="number" id="pDiscountPrice" required placeholder="e.g. 2500">
      </div>
      <div class="form-group-full">
        <label>Main Image Link (ImgBB Direct URL)</label>
        <input type="url" id="pImg1" required placeholder="https://i.ibb.co/...">
      </div>
      <div>
        <label>Sub Image Link 2 (Optional)</label>
        <input type="url" id="pImg2" placeholder="https://i.ibb.co/...">
      </div>
      <div>
        <label>Sub Image Link 3 (Optional)</label>
        <input type="url" id="pImg3" placeholder="https://i.ibb.co/...">
      </div>
      <div>
        <label>Sub Image Link 4 (Optional)</label>
        <input type="url" id="pImg4" placeholder="https://i.ibb.co/...">
      </div>
      <div>
        <label>Sub Image Link 5 (Optional)</label>
        <input type="url" id="pImg5" placeholder="https://i.ibb.co/...">
      </div>
      <div class="form-group-full" style="display:flex; gap:10px;">
        <button type="submit" id="submitBtn" style="background:#059669; color:white; padding:10px; border:none; border-radius:6px; font-weight:bold; flex:1; cursor:pointer;">+ Add New Product</button>
        <button type="button" id="cancelEditBtn" onclick="resetForm()" style="background:#6b7280; color:white; padding:10px; border:none; border-radius:6px; font-weight:bold; display:none; cursor:pointer;">Cancel Edit</button>
      </div>
    </form>

    <h3>Current Inventory Management</h3>
    <table class="admin-table">
      <thead>
        <tr>
          <th>Image</th>
          <th>Title</th>
          <th>Price</th>
          <th>Stock Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="adminProductTable">
        <!-- Products Render Here -->
      </tbody>
    </table>
  </div>

  <script>
    let products = [];
    try {
      const saved = localStorage.getItem('nexus_products');
      if (saved) {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed)) {
          products = parsed;
        }
      }
    } catch (e) {
      products = [];
    }

    function checkAdminLogin() {
      const pass = document.getElementById('adminPassInput').value;
      if (pass === "nexus123") {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('adminDashboard').style.display = 'block';
        renderAdminTable();
      } else {
        alert("වැරදි මුරපදයක් (Incorrect Password)!");
      }
    }

    function renderAdminTable() {
      const tbody = document.getElementById('adminProductTable');
      if(!tbody) return;
      tbody.innerHTML = '';

      if (products.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#6b7280;">තවම නිෂ්පාදන එකතු කර නැත.</td></tr>`;
        return;
      }

      products.forEach(p => {
        let mainImg = (p.images && p.images.length > 0) ? p.images[0] : '';
        tbody.innerHTML += `
          <tr>
            <td><img src="${mainImg}" width="40" height="40" style="object-fit:cover; border-radius:4px;"></td>
            <td><strong>${p.title || ''}</strong></td>
            <td>Rs. ${p.discountPrice || 0} ${p.originalPrice ? `<small><del>(Rs. ${p.originalPrice})</del></small>`:''}</td>
            <td>
              <button class="btn-action btn-toggle" onclick="toggleStock(${p.id})">
                ${p.status === 'in' ? '🟢 In Stock' : '🔴 Out of Stock'}
              </button>
            </td>
            <td>
              <button class="btn-action btn-edit" onclick="editProduct(${p.id})">Edit</button>
              <button class="btn-action btn-del" onclick="deleteProduct(${p.id})">Delete</button>
            </td>
          </tr>
        `;
      });
    }

    function toggleStock(id) {
      products = products.map(p => p.id === id ? {...p, status: p.status === 'in' ? 'out' : 'in'} : p);
      saveData();
    }

    function deleteProduct(id) {
      if (confirm("මෙම Product එක ඉවත් කිරීමට අවශ්‍යද?")) {
        products = products.filter(p => p.id !== id);
        saveData();
      }
    }

    function editProduct(id) {
      const p = products.find(item => item.id === id);
      if(!p) return;

      document.getElementById('editProductId').value = p.id;
      document.getElementById('pTitle').value = p.title || '';
      document.getElementById('pStatus').value = p.status || 'in';
      document.getElementById('pOriginalPrice').value = p.originalPrice || '';
      document.getElementById('pDiscountPrice').value = p.discountPrice || '';

      for(let i=1; i<=5; i++) {
        const input = document.getElementById(`pImg${i}`);
        if(input) input.value = (p.images && p.images[i-1]) ? p.images[i-1] : '';
      }

      document.getElementById('submitBtn').innerText = "💾 Update Product";
      document.getElementById('cancelEditBtn').style.display = 'block';
      window.scrollTo({top: 0, behavior: 'smooth'});
    }

    function resetForm() {
      document.getElementById('addProductForm').reset();
      document.getElementById('editProductId').value = '';
      document.getElementById('submitBtn').innerText = "+ Add New Product";
      document.getElementById('cancelEditBtn').style.display = 'none';
    }

    function saveProduct(e) {
      e.preventDefault();
      const editId = document.getElementById('editProductId').value;
      const imgs = [
        document.getElementById('pImg1').value,
        document.getElementById('pImg2').value,
        document.getElementById('pImg3').value,
        document.getElementById('pImg4').value,
        document.getElementById('pImg5').value
      ].filter(url => url.trim() !== '');

      const title = document.getElementById('pTitle').value;
      const status = document.getElementById('pStatus').value;
      const originalPrice = Number(document.getElementById('pOriginalPrice').value) || null;
      const discountPrice = Number(document.getElementById('pDiscountPrice').value);

      if (editId) {
        products = products.map(p => {
          if (String(p.id) === String(editId)) {
            return { ...p, title, status, originalPrice, discountPrice, images: imgs };
          }
          return p;
        });
        alert("Product එක සාර්ථකව Update විය!");
      } else {
        const newP = {
          id: Date.now(),
          title,
          status,
          originalPrice,
          discountPrice,
          images: imgs
        };
        products.push(newP);
        alert("Product එක සාර්ථකව එකතු විය!");
      }

      saveData();
      resetForm();
    }

    function saveData() {
      localStorage.setItem('nexus_products', JSON.stringify(products));
      renderAdminTable();
    }
  </script>
</body>
</html>
