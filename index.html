  <style>
    :root {
      --bg-color: #070f2b;
      --card-bg: #1b1a55;
      --accent-neon: #00f0ff;
      --accent-blue: #0077b6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --glow: 0 0 15px rgba(0, 240, 255, 0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; }
    
    /* Intro Animation Loader */
    #introLoader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #030617; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.5s ease; }
    .neon-spinner { width: 70px; height: 70px; border: 4px solid rgba(0, 240, 255, 0.1); border-top: 4px solid var(--accent-neon); border-radius: 50%; animation: spin 1s linear infinite; box-shadow: var(--glow); }
    .loader-title { margin-top: 20px; font-size: 24px; font-weight: 800; color: var(--accent-neon); letter-spacing: 2px; text-shadow: var(--glow); animation: pulse 1.5s infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }

    /* Header */
    header { background: #0b132b; color: white; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; border-bottom: 2px solid rgba(0, 240, 255, 0.3); box-shadow: 0 4px 20px rgba(0,0,0,0.5); position: sticky; top: 0; z-index: 100; }
    .brand { display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .brand img { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--accent-neon); box-shadow: var(--glow); }
    .brand h1 { color: var(--accent-neon); font-size: 24px; font-weight: 800; text-shadow: var(--glow); }
    
    .search-bar { flex: 1; max-width: 350px; padding: 10px 15px; border-radius: 8px; border: 1px solid var(--accent-blue); background: #070f2b; color: white; font-size: 14px; outline: none; box-shadow: inset 0 0 8px rgba(0,119,182,0.3); }
    .search-bar:focus { border-color: var(--accent-neon); box-shadow: var(--glow); }
    
    .header-actions { display: flex; align-items: center; gap: 15px; }
    .cart-btn { background: #1e1b4b; border: 1px solid var(--accent-neon); color: var(--accent-neon); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 6px; box-shadow: var(--glow); transition: 0.2s; }
    .cart-btn:hover { background: var(--accent-neon); color: #070f2b; }

    .user-auth { display: flex; align-items: center; gap: 10px; }
    .btn-auth { background: var(--accent-blue); color: white; border: none; padding: 8px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 6px; }
    .btn-auth:hover { background: #00b4d8; }
    .user-profile { display: flex; align-items: center; gap: 8px; color: white; font-size: 14px; background: #1e293b; padding: 5px 10px; border-radius: 20px; border: 1px solid var(--accent-blue); }
    .user-profile img { width: 28px; height: 28px; border-radius: 50%; }

    /* Banner Ad Section */
    .banner-container { max-width: 1200px; margin: 25px auto 0; padding: 0 20px; }
    .promo-banner { width: 100%; height: 180px; background: linear-gradient(135deg, #1e1b4b, #0f172a); border: 2px dashed var(--accent-neon); border-radius: 15px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; box-shadow: var(--glow); position: relative; overflow: hidden; }
    .promo-banner h2 { color: var(--accent-neon); font-size: 24px; margin-bottom: 8px; text-shadow: var(--glow); }
    .promo-banner p { color: var(--text-muted); font-size: 14px; }

    .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
    .section-title { font-size: 22px; font-weight: bold; margin-bottom: 20px; color: var(--accent-neon); border-bottom: 2px solid var(--accent-neon); display: inline-block; padding-bottom: 5px; text-shadow: var(--glow); }
    
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 22px; }
    
    .card { background: #0b132b; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.4); border: 1px solid rgba(0, 240, 255, 0.2); position: relative; display: flex; flex-direction: column; justify-content: space-between; transition: 0.3s; }
    .card:hover { transform: translateY(-5px); border-color: var(--accent-neon); box-shadow: var(--glow); }
    .badge-stock { position: absolute; top: 10px; right: 10px; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; color: white; z-index: 5; }
    .in-stock { background: #059669; }
    .out-of-stock { background: #dc2626; }
    
    .card-img-container { width: 100%; height: 220px; background: #030617; position: relative; overflow: hidden; }
    .main-card-img { width: 100%; height: 100%; object-fit: cover; }
    
    .thumb-bar { display: flex; gap: 4px; padding: 6px; background: #0b132b; overflow-x: auto; }
    .thumb-img { width: 38px; height: 38px; object-fit: cover; border-radius: 4px; cursor: pointer; border: 1px solid #334155; opacity: 0.7; }
    .thumb-img:hover, .thumb-img.active { opacity: 1; border-color: var(--accent-neon); }
    
    .card-details { padding: 15px; flex-grow: 1; }
    .card-details h3 { font-size: 17px; color: white; margin-bottom: 6px; }
    
    .price-box { margin-bottom: 12px; display: flex; align-items: baseline; gap: 8px; }
    .price-discount { font-size: 19px; color: var(--accent-neon); font-weight: bold; text-shadow: 0 0 8px rgba(0,240,255,0.3); }
    .price-original { font-size: 14px; color: var(--text-muted); text-decoration: line-through; }
    
    .card-actions { display: flex; gap: 8px; }
    .btn-buy { flex: 1; background: var(--accent-blue); color: white; padding: 10px; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; transition: 0.2s; }
    .btn-buy:hover { background: #00b4d8; box-shadow: var(--glow); }
    .btn-buy:disabled { background: #334155; cursor: not-allowed; }

    .btn-cart-add { background: #1e1b4b; border: 1px solid var(--accent-neon); color: var(--accent-neon); padding: 10px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .btn-cart-add:hover { background: var(--accent-neon); color: #070f2b; }

    .no-products { grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--text-muted); font-size: 16px; background: #0b132b; border-radius: 12px; border: 1px solid rgba(0,240,255,0.1); }

    /* Modal / Pop-up Form (Neon Style) */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3, 6, 23, 0.85); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(5px); }
    .modal-content { background: #0b132b; border: 2px solid var(--accent-neon); padding: 25px; border-radius: 15px; max-width: 480px; width: 90%; box-shadow: 0 0 30px rgba(0, 240, 255, 0.3); max-height: 90vh; overflow-y: auto; }
    .modal-content h2 { margin-bottom: 15px; color: var(--accent-neon); font-size: 20px; text-shadow: var(--glow); }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px; color: var(--text-muted); }
    .modal-content input, .modal-content textarea, .modal-content select { width: 100%; padding: 10px; border: 1px solid var(--accent-blue); background: #070f2b; color: white; border-radius: 6px; font-size: 14px; outline: none; }
    .modal-content input:focus { border-color: var(--accent-neon); box-shadow: var(--glow); }
    
    .otp-box { display: flex; gap: 8px; }
    .otp-box input { flex: 1; }
    .btn-otp { background: var(--accent-blue); color: white; border: none; padding: 0 15px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; }

    .checkout-btns { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
    .btn-wa { background: #25D366; color: white; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; box-shadow: 0 0 10px rgba(37,211,102,0.4); }
    .btn-close { background: #334155; color: white; padding: 10px; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; }

    footer { text-align: center; padding: 25px; color: var(--text-muted); font-size: 13px; margin-top: 50px; background: #0b132b; border-top: 1px solid rgba(0,240,255,0.2); }
  </style>
